# Root blueprint — deploy signlang-ai from jars_project_onnx with Docker.
services:
  - type: web
    name: signlang-ai
    runtime: docker
    region: oregon
    plan: free
    rootDir: jars_project_onnx
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SOCKETIO_ASYNC_MODE
        value: gevent
      - key: CORS_ORIGINS
        sync: false
